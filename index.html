<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Formulario de contacto"
  >

  <title>
    Formulario de contacto
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef2f6,
          #dce2e8
        );

      color: #1f2937;

    }


    .contenedor {

      width: 100%;

      max-width: 430px;

      padding: 32px;

      background: #ffffff;

      border-radius: 18px;

      box-shadow:
        0 15px 45px
        rgba(0, 0, 0, 0.14);

    }


    .icono {

      width: 60px;

      height: 60px;

      margin:
        0 auto 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #1d4ed8
        );

      color: #ffffff;

      font-size: 25px;

      font-weight: bold;

    }


    h1 {

      margin:
        0 0 10px;

      text-align: center;

      font-size: 26px;

      color: #111827;

    }


    .descripcion {

      margin:
        0 0 28px;

      text-align: center;

      color: #6b7280;

      font-size: 15px;

      line-height: 1.5;

    }


    .grupo {

      margin-bottom: 18px;

    }


    label {

      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: bold;

      color: #374151;

    }


    input {

      width: 100%;

      height: 50px;

      padding:
        0 14px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      background: #ffffff;

      color: #111827;

      font-size: 16px;

      outline: none;

    }


    input:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.12);

    }


    button {

      width: 100%;

      height: 50px;

      margin-top: 4px;

      border: none;

      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #1d4ed8
        );

      color: #ffffff;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .mensaje {

      display: none;

      margin-top: 18px;

      padding: 14px;

      border-radius: 9px;

      text-align: center;

      font-size: 14px;

      line-height: 1.45;

    }


    .mensaje.mostrado {

      display: block;

    }


    .mensaje.enviando {

      background: #eff6ff;

      color: #1d4ed8;

    }


    .mensaje.correcto {

      background: #ecfdf5;

      color: #047857;

    }


    .mensaje.error {

      background: #fef2f2;

      color: #b91c1c;

    }


    .informacion {

      margin-top: 20px;

      padding: 13px;

      border-radius: 9px;

      background: #f3f4f6;

      color: #6b7280;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;

    }


    .pie {

      margin-top: 20px;

      text-align: center;

      color: #9ca3af;

      font-size: 11px;

    }

  </style>

</head>


<body>


  <main class="contenedor">


    <div class="icono">
      C
    </div>


    <h1>
      Formulario de contacto
    </h1>


    <p class="descripcion">
      Completa tus datos para enviar tu solicitud.
    </p>


    <form
      id="formulario"
      autocomplete="on"
    >


      <div class="grupo">

        <label for="nombre">
          Nombre
        </label>

        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Escribe tu nombre"
          autocomplete="given-name"
          maxlength="100"
          required
        >

      </div>


      <div class="grupo">

        <label for="apellidos">
          Apellidos
        </label>

        <input
          type="text"
          id="apellidos"
          name="apellidos"
          placeholder="Escribe tus apellidos"
          autocomplete="family-name"
          maxlength="150"
          required
        >

      </div>


      <button
        type="submit"
        id="botonEnviar"
      >
        Enviar datos
      </button>


    </form>


    <div
      id="mensaje"
      class="mensaje"
    ></div>


    <div class="informacion">

      Los datos introducidos se utilizarán
      únicamente para gestionar esta solicitud
      y contactar contigo cuando sea necesario.

    </div>


    <div class="pie">

      Formulario de contacto

    </div>


  </main>


  <script>


    // ========================================================
    // URL DE GOOGLE APPS SCRIPT
    // ========================================================

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbw7oPbIaUXSVG8OnMpPpI45x6PH8N7ZeukyG5OoMfeGQYJc_7-102L8ONdTxEeAMQwR/exec";


    // ⬆️⬆️⬆️ ESTA ES LA ZONA DONDE PEGAS LA URL
    // QUE TE DA GOOGLE APPS SCRIPT.
    //
    // SI CREAS OTRA IMPLEMENTACIÓN EN EL FUTURO,
    // SUSTITUYES SOLAMENTE ESA URL.
    // ========================================================



    const formulario =
      document.getElementById(
        "formulario"
      );


    const nombre =
      document.getElementById(
        "nombre"
      );


    const apellidos =
      document.getElementById(
        "apellidos"
      );


    const botonEnviar =
      document.getElementById(
        "botonEnviar"
      );


    const mensaje =
      document.getElementById(
        "mensaje"
      );



    formulario.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const nombreValor =
          nombre.value.trim();


        const apellidosValor =
          apellidos.value.trim();


        if (
          !nombreValor ||
          !apellidosValor
        ) {

          mostrarMensaje(
            "Debes completar Nombre y Apellidos.",
            "error"
          );

          return;

        }


        botonEnviar.disabled = true;

        botonEnviar.textContent =
          "Enviando...";


        mostrarMensaje(
          "Enviando tus datos...",
          "enviando"
        );



        const datos =
          new URLSearchParams();


        datos.append(
          "nombre",
          nombreValor
        );


        datos.append(
          "apellidos",
          apellidosValor
        );



        fetch(
          URL_APPS_SCRIPT,
          {

            method: "POST",

            mode: "no-cors",

            body: datos

          }
        )

        .then(
          function() {

            formulario.reset();


            mostrarMensaje(
              "Los datos se han enviado correctamente.",
              "correcto"
            );


            botonEnviar.disabled =
              false;


            botonEnviar.textContent =
              "Enviar datos";

          }
        )

        .catch(
          function(error) {

            console.error(
              error
            );


            mostrarMensaje(
              "No se pudieron enviar los datos. Inténtalo de nuevo.",
              "error"
            );


            botonEnviar.disabled =
              false;


            botonEnviar.textContent =
              "Enviar datos";

          }
        );

      }
    );



    function mostrarMensaje(
      texto,
      tipo
    ) {

      mensaje.className =
        "mensaje mostrado " +
        tipo;

      mensaje.textContent =
        texto;

    }


  </script>


</body>

</html>
